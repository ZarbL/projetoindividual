name: CD – Build & Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build e Push para GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mkjs-backend:latest

      - name: Build e Push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.nginx
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mkjs-frontend:latest
